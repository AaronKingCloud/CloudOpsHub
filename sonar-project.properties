# SonarCloud (SonarQube Cloud) settings, read by .github/workflows/sonarcloud.yml.
# Setup and how to read the results: docs/quality/SONARQUBE.md
# projectKey and organization must match what SonarCloud shows after importing the repo.

sonar.projectKey=AaronKingCloud_CloudOpsHub
sonar.organization=aaronkingcloud
sonar.projectName=CloudOps Hub
sonar.sourceEncoding=UTF-8

# What gets analysed
sonar.sources=frontend/src,backend/app,backend/scripts,agent
sonar.tests=frontend/src,backend/tests
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,backend/tests/**
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**

# Coverage reports produced by the workflow (npm run test:coverage, pytest --cov)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.version=3.13

# Sample data and the entry file have nothing to test. The agent runs on monitored devices and is
# tested through the backend's /agent/metrics tests, so it's analysed for bugs but not counted for coverage.
sonar.coverage.exclusions=frontend/src/mock/**,frontend/src/main.tsx,agent/**
