<svg xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 496" role="img" aria-label="Every request enters through CloudFront; one server runs both containers" font-size="13"><rect width="760" height="496" fill="#ffffff"/><defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9a92"/></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1f1f">Every request enters through CloudFront; one server runs both containers</text><g><rect x="384" y="48" width="352" height="424" rx="8" fill="#f2f2ef" stroke="#9a9a92" stroke-width="1"/><text x="400" y="68" font-size="11.5" font-weight="600" fill="#5f5f5a">AWS us-east-2 (all created by Terraform)</text></g><g><rect x="400" y="80" width="320" height="200" rx="8" fill="none" stroke="#9a9a92" stroke-width="1.25" stroke-dasharray="4 3"/><text x="416" y="100" font-size="11.5" font-weight="600" fill="#5f5f5a">EC2 t3.micro, Docker Compose</text></g><g fill="none" stroke="#9a9a92" stroke-width="1.25"><path d="M174 124H208" marker-end="url(#arch-arrow)"/><path d="M174 196H208" marker-end="url(#arch-arrow)"/><path d="M358 160H416" marker-end="url(#arch-arrow)"/><path d="M552 144H568" marker-end="url(#arch-arrow)"/><path d="M636 172V208" marker-end="url(#arch-arrow)"/><path d="M636 264V304" marker-end="url(#arch-arrow)"/><path d="M568 160H560V420H536" marker-end="url(#arch-arrow)"/><path d="M560 332H536" marker-end="url(#arch-arrow)"/><path d="M174 428H376V264H400" marker-end="url(#arch-arrow)"/></g><g><rect x="24" y="96" width="150" height="56" rx="8" fill="#ffffff" fill-opacity="1" stroke="#9a9a92" stroke-width="1.25"/><text x="99" y="120" text-anchor="middle" font-weight="600" fill="#1f1f1f">Browser</text><text x="99" y="138" text-anchor="middle" font-size="11.5" fill="#5f5f5a">signed-in users</text></g><g><rect x="24" y="168" width="150" height="56" rx="8" fill="#ffffff" fill-opacity="1" stroke="#9a9a92" stroke-width="1.25"/><text x="99" y="192" text-anchor="middle" font-weight="600" fill="#1f1f1f">Metrics agent</text><text x="99" y="210" text-anchor="middle" font-size="11.5" fill="#5f5f5a">on each device, 60 s</text></g><g><rect x="208" y="96" width="150" height="128" rx="8" fill="#2f7bd9" fill-opacity="0.12" stroke="#2f7bd9" stroke-width="2"/><text x="283" y="152" text-anchor="middle" font-weight="600" fill="#1f1f1f">CloudFront</text><text x="283" y="170" text-anchor="middle" font-size="11.5" fill="#1f1f1f">HTTPS, IP allowlist</text></g><g><rect x="416" y="116" width="136" height="56" rx="8" fill="#ffffff" fill-opacity="1" stroke="#9a9a92" stroke-width="1.25"/><text x="484" y="140" text-anchor="middle" font-weight="600" fill="#1f1f1f">Frontend</text><text x="484" y="158" text-anchor="middle" font-size="11.5" fill="#5f5f5a">nginx + React</text></g><g><rect x="568" y="116" width="136" height="56" rx="8" fill="#ffffff" fill-opacity="1" stroke="#9a9a92" stroke-width="1.25"/><text x="636" y="140" text-anchor="middle" font-weight="600" fill="#1f1f1f">Backend</text><text x="636" y="158" text-anchor="middle" font-size="11.5" fill="#5f5f5a">FastAPI, alerts</text></g><g><rect x="568" y="208" width="136" height="56" rx="8" fill="#ffffff" fill-opacity="1" stroke="#9a9a92" stroke-width="1.25"/><text x="636" y="232" text-anchor="middle" font-weight="600" fill="#1f1f1f">Data disk (EBS)</text><text x="636" y="250" text-anchor="middle" font-size="11.5" fill="#5f5f5a">both databases</text></g><g><rect x="568" y="304" width="136" height="56" rx="8" fill="#ffffff" fill-opacity="1" stroke="#9a9a92" stroke-width="1.25"/><text x="636" y="328" text-anchor="middle" font-weight="600" fill="#1f1f1f">Daily snapshots</text><text x="636" y="346" text-anchor="middle" font-size="11.5" fill="#5f5f5a">kept 7 days</text></g><g><rect x="416" y="304" width="120" height="56" rx="8" fill="#ffffff" fill-opacity="1" stroke="#9a9a92" stroke-width="1.25"/><text x="476" y="328" text-anchor="middle" font-weight="600" fill="#1f1f1f">SNS email</text><text x="476" y="346" text-anchor="middle" font-size="11.5" fill="#5f5f5a">critical alerts</text></g><g><rect x="416" y="384" width="120" height="72" rx="8" fill="#ffffff" fill-opacity="1" stroke="#9a9a92" stroke-width="1.25"/><text x="476" y="408" text-anchor="middle" font-weight="600" fill="#1f1f1f">AWS APIs</text><text x="476" y="426" text-anchor="middle" font-size="11.5" fill="#5f5f5a">read-only: EC2,</text><text x="476" y="442" text-anchor="middle" font-size="11.5" fill="#5f5f5a">CloudWatch, cost</text></g><g><rect x="24" y="400" width="150" height="56" rx="8" fill="#ffffff" fill-opacity="1" stroke="#9a9a92" stroke-width="1.25"/><text x="99" y="424" text-anchor="middle" font-weight="600" fill="#1f1f1f">GitHub Actions</text><text x="99" y="442" text-anchor="middle" font-size="11.5" fill="#5f5f5a">build, push to ECR</text></g><text x="272" y="420" text-anchor="middle" font-size="11.5" fill="#5f5f5a">deploy on merge (OIDC)</text></svg>
