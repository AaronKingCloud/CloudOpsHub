# Security checks: known-vulnerable dependencies and leaked secrets.
# Runs on every push and PR, and weekly so new advisories are caught even when nobody pushes.
name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Fails on high or critical advisories in any frontend dependency.
      - name: npm audit
        run: npm audit --audit-level=high

  backend-dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: pip install pip-audit==2.9.0
      # Fails on any known vulnerability in the backend's dependencies.
      - name: pip-audit
        run: pip-audit -r requirements.txt

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not just the latest commit
      # gitleaks looks for API keys, tokens and private keys. Known placeholders are allowed in .gitleaks.toml.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose
